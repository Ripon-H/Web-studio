<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Set 1</title>
    <link rel="stylesheet" href="index.css">
    <style>
        /*This is style tag*/
        #heading {
           color: brown;
        }

         /* This is id selector.for id we use # */
        #div_22 {
            color: crimson;
        }
        /*This is element selector*/
        p {
            color: darksalmon;
        }
        /* This is class selector.for class we use . */
        .special_heading {
            color: gold;
        }
        
        /*This is group selector. We use , */
        #first, #second {
            color: fuchsia;
        }

    </style>
</head>
<body>
    <h1 style="color: blue;">This is my Heading</h1>
    <!--Change the color of the heading-->
    <hr>
    <div id="heading" style="color: chartreuse;">This is external styling</div>
    <!--changing color using external styling plus we also try style tag and also tried inline styling. First priority is inline then style tag then external styling-->
    <!--if you want to make comment in css then use /**/-->
    <hr>

    <div id="div_22">div</div>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Facilis, dignissimos.</p>
    <h2 class="special_heading">This is my second heading</h2>
    <hr>

    <div id="first">First</div>
    <div id="second">Second</div>
    

</body>
</html>
