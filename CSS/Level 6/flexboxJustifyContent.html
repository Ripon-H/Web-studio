<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify content</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        .box {
            height: 100px;
            width: 100px;
            border: 3px solid black;
            margin: 5px;
        }
        #heading{margin-right: 200px;}
        #container {
            height: 600px;
            width: 600px;
            padding: 10px;
            margin: 20px;
            border: 3px solid black;

            display: flex;
            justify-content: center;
            /* justify content have 5 types: flex-start, flex-end, center, space-between, space-around, space-evenly*/
            flex-wrap: wrap;
            /*flex-wrap have 3 types: nowarp which is default , wrap, and wrap-reverse.*/
            align-items: start;
            /*This property is used to align the flex containers items along the cross-axis, which is perpendicular to the main axis. It mainly use center, end, start.*/
            align-content: center;
        }
        #box1 {background-color: yellow;}
        #box2 {background-color: red;}
        #box3 {background-color: green;
               flex-shrink: 4;}
        #box4 {
            background-color: blue;
            align-self: flex-end;
            }
    </style>
</head>
<body>
    <h1 id="heading">Justify Content</h1>
    <div id="container">
        <div id="box1" class="box">Box 1</div>
        <div id="box2" class="box">Box 2</div>
        <div id="box3" class="box">Box 3</div>
        <div id="box4" class="box">Box 4</div>
    

    </div>
</body>
</html>
