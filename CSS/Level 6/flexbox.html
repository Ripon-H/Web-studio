<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        .box {
            height: 100px;
            width: 175px;
            border: 3px solid black;
            margin-right: 5px;
        }
        #heading {margin-left: 200px;}
        #container {
            height: 150px;
            width: 600px;
            padding: 10px;
            margin: 20px;
            border: 3px solid black;

            display: flex;
            flex-direction: row-reverse;
        }

        #box1 {background-color: yellow;}
        #box2 {background-color: green;}
        #box3 {background-color: red;}
        #box4 {background-color: blue;}
    </style>
</head>
<body>
    <!--Flexbox is a one dimentional layout method for arranging items in rows or columns.-->
    <h1 id="heading">Flex container</h1>
    <div id="container">
        <div id="box1" class="box">Flex item 1</div>
        <div id="box2" class="box">Flex item 2</div>
        <div id="box3" class="box">Flex item 3</div>
        <div id="box4" class="box">Flex item 4</div>
    </div>
</body>
</html>
