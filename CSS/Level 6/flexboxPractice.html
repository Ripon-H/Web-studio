<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox Practice</title>
    <style>
        
        .flex-container{
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            width: 300px;
            height: 200px;
            background-color: antiquewhite;
            align-content: space-evenly;
        }
        .flex-container div {
            width: 100px;
            height: 100px;
            border: 2px solid black;
            padding: 10px;
        }
        .flex-container div:nth-child(1){
            align-self: flex-end;
        }
        .flex-container div:nth-child(2){
            align-self: center;
        }
        
        
        
    </style>
</head>
<body>
    <h2>Flexbox Practice</h2>
    <div class="flex-container">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
    </div>
</body>
</html>
