<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative Unit-Percentage</title>
    <style>
        #first {
            height: 100px;
            width: 100px;
            background-color: blue;
            font-size: 25px;
        }

        #second {
            background-color: red;
            width: 60%;
            height: 30%;
        }
    </style>
</head>
<body>
    <div id="first">
        first div
        <div id="second">
            second div

        </div>
    </div>
    
</body>
</html>
