<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Block/inline Element</title>
    <style>
        *{margin: 0; padding: 0;}
        .box {
            height: 100px; width: 100px;
            margin: 5px;
            background-color: darkolivegreen;

            display: block;

        }
        #box3 {
            height: 100px; width: 100px;
            margin: 5px;
            background-color: darkolivegreen;

            display: inline;
        }
        #box4 {
            height: 100px; width: 100px;
            margin: 5px;
            background-color: darkolivegreen;

            display: inline;
        }
        /* in inline element we cannot give height and width like block element.if we want to give height and width in inline element then we have to type display: inline-block */
        #box5 {
            height: 100px; width: 100px;
            margin: 5px;
            background-color: darkolivegreen;

            display: inline-block;
        }
        #box6 {
            height: 100px; width: 100px;
            margin: 5px;
            background-color: darkolivegreen;

            display: inline-block;
        }
        #box1 {
            display: none;
        }
    </style>
</head>
<body>
    <div id="box1" class="box">box1</div>
    <div id="box2" class="box">Box2</div>
    <div id="box3">Box3</div>
    <div id="box4">Box4</div>
    <div id="box5">box5</div>
    <div id="box6">box6</div>
</body>
</html>
