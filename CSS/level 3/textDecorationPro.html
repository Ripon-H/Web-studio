<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Decoration</title>
    <style>
        /*this is text decoration*/
        #box1 {
            text-decoration: underline;
        }
        #box2 {
            text-decoration: overline;
        }
        #box3 {
            text-decoration: line-through;
        }
        #link {
            text-decoration: none;
        }
        /*this is text decoration style*/
        .box {
            text-decoration: underline;
        }
        #box4 {text-decoration-style:dashed ;}
        #box5 {text-decoration-style: double;}
        #box6 {text-decoration-style: solid;}
        #box7 {text-decoration-style: wavy;}
        /*below we used text decoration color*/
        .box1 {text-decoration: underline;}
        #box8 {text-decoration-color: red;}
        #box9 {text-decoration-color: brown;}
        #box10 {text-decoration-color: chartreuse;}
        #box11 {text-decoration-color: darkgreen;}
    </style>
</head>
<body>
    <div id="box1" class="box">Box1</div>
    <div id="box2" class="box">Box2</div>
    <div id="box3" class="box">Box3</div> <hr>
    <a href="#">link1</a><br>
    <a href="#" style="text-decoration: none;">link2</a><br>
    <a id="link" href="#">This is a link</a>
<hr>

<!--we can also apply style to text decoration. for this we have to put text-decoration-style.-->
<h3 id="box4" class="box">box4</h3>
<h3 id="box5" class="box">box5</h3>
<h3 id="box6" class="box">box6</h3>
<h3 id="box7" class="box">box7</h3>
<hr>
<!--we can also apply color to text decoration.For this we have to put text-decoration-color.-->
<h3 id="box8" class="box1">box4</h3>
<h3 id="box9" class="box1">box5</h3>
<h3 id="box10" class="box1">box6</h3>
<h3 id="box11" class="box1">box7</h3>
<hr>
</body>
</html>
