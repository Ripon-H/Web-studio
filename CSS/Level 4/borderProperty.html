<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Property</title>
    <style>
        *{margin: 0; padding: 0;}
        #button1 {
            height: 100px; width: 100px;
            margin: 5px;
            padding: 5px;
            border: 5px solid;
            border-radius: 30px;
            background-color: brown;
        }
    </style>
</head>
<body>
    <button id="button1">click me</button>
</body>
</html>
