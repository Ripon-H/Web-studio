<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css transform</title>
    <style>
        .box {
            height: 50px;
            width: 50px;
            border: 2px solid black;
            border-radius: 5px;
            background-color: plum;
            position: relative;
            top: 50px;
            left: 50px;

            transition: all 2s ease-in 0s;
            
        }
        /*we can also do this*/
        .box:hover {
            transform: rotate(45deg);
        }
        .box1 {
            height: 50px;
            width: 50px;
            border: 2px solid black;
            border-radius: 5px;
            background-color: aqua;
            position: relative;
            top: 50px;
            left: 50px;

            transition: all 1s ease-in;
        }
        .box1:hover {
            transform: scale(2);
        }
        .box2 {
            height: 70px;
            width: 70px;
            border: 2px solid black;
            border-radius: 5px;
            background-color: blue;
            position: relative;
            top: 50px;
            left: 50px;

            transition: all 1s ease-in;
        }

        .box2:hover {
            transform: translate(50px, 50px);
        }
        .box3 {
            height: 70px;
            width: 70px;
            border: 2px solid black;
            border-radius: 5px;
            background-color: red;
            position: relative;
            top: 50px;
            left: 50px;

            transition: all 1s ease-in;
        }

        .box3:hover {
            transform: skew(180deg);
        }
    </style>
</head>
<body>
    <div class="box">Rotate</div>
    <br>
    <div class="box1">Scale</div>
    <br>
    <div class="box2">Translate</div>
    <br>
    <div class="box3">Skew</div>
</body>
</html>
