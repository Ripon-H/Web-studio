<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <style>
        .pseudo {
            height: 25px;
            width: 150px;
            background-color: forestgreen;
            border: 2px solid black;
            border-radius: 10px;

            transition-property: all;
            transition-duration: 4s;
            transition-timing-function: ease-in-out;
            transition-delay: 1s;
            /* we can also type this for transition(transtion: all 1s ease-in-out 1s)*/

        }
        .pseudo:hover {
            height: 30px;
            width: 160px;
            background-color: red;
        }
        .pseudo:active {
            height: 30px;
            width: 160px;
            background-color: blue;
        }
    </style>
</head>
<body>
    <button class="pseudo">Learning Pseudo</button>
</body>
</html>
