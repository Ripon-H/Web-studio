<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id and class selectors</title>
    <style>
        #first_heading {
            color: blue;
        }
        #random_text {
            color: blueviolet;
        }
        .second {
            color: darkgreen;
        }
    </style>
</head>
<body>
    <!--for id selector we use #-->
    
    <h1 id="first_heading">This is the heading</h1>
    <p id="random_text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Architecto, repellat.</p>

    <!--class selector, to define class selector we use . -->
    <div class="second">Second div</div>
    <div class="second">Third div</div>
    <h2 class="second">This is second heading</h2>
    <p class="second">This is paragraph</p>

    
</body>
</html>
