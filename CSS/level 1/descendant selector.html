<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descendant selector</title>
    <style>
        #first p {
            color: blueviolet;
        }

        p {
            color: darkgreen;
        }

    </style>
</head>
<body>
    <div id="first">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ipsum nulla dolores ut ducimus quod eos?</p>
    </div>
    
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Incidunt, vel.</p>
</body>
</html>
