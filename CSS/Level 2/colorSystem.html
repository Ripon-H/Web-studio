<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color system (RGB) color</title>
</head>
<body>
    <div  style="background-color: rgb(70, 70, 168);">RGB color system</div>
    <hr>
    <div style="background-color: #6e1515;">This Hex color system</div>
    <hr>
    <h1 style="color: rgba(255,0, 0, 0.1);">First</h1>
    <h1 style="color: rgba(255,0, 0, 0.25);">First</h1>
    <h1 style="color: rgba(255,0, 0, 0.5);">First</h1>
    <h1 style="color: rgba(255,0, 0, 0.75);">First</h1>
    <h1 style="color: rgba(255,0, 0, 1.0);">First</h1>
    <!--This is called alpha channel. It is used for transparency and visual effects and layering. we have to write "a" after writing rgb and include . in the last and the range of alpha channel is (0-1)-->
</body>
</html>
