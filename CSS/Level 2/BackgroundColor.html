<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color</title>
    <style>
        #first {
            color: black; background-color: rgb(243, 7, 105);
        }
        #second {
            color: black; background-color: blue;
        }
        button {
            color: black; background-color: brown;
        }
        .back_learn {
            color: blueviolet; background-color: cadetblue;
        }
        #learn {
            color: darkred; background-color: chartreuse;
        }
    </style>
</head>
<body>
    <div id="first">First</div>
    <div id="second">Second</div>
    <button>Click me</button>
    <hr>

    <div class="back_learn">background color</div>
    <div class="back_learn">background color two</div>
    <div id="learn">Background three</div>
    
</body>
</html>
