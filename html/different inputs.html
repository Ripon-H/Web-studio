<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different type of inputs</title>
</head>
<body>
    <!--forms input basics-->
    <form>
        Username: <input type="text" placeholder="email"><br>

        password: <input type="password">
        <input type="submit" value="submit">
    </form>

    <hr>
    <!--Action attribute in a form-->
    <form action="/contact-me">
        Username: <input type="text" placeholder="email" required="true"><br>
        password: <input type="password"><br>
        <input type="submit">
</form>

<hr>

<!--Name and Value property and label tags-->
<form action="/contact-me">
    <label for="email"> Username:</label>
    <input type="text" id="email" placeholder="email"><br>

    <label for="user_password">password:</label>
    <input id="user_password" type="password"><br>
    <input type="submit">
    </form>

    <hr>

    <form action="/contact-me">
        Username: <input type="text" name="username" value="Ripon"placeholder="email" required="true"><br>
        password: <input type="password"><br>
        <input type="submit">

        </form>

        <!--input type Date-->

        <form action="/contact-me">
            Username: <input type="text" name="username" value="Ripon"placeholder="email" required="true"><br>
            password: <input type="password"><br>
            Date: <input type="date"><br>
            <input type="submit">

            </form>

            <hr>

            <!--include file tag-->
            <form action="/contact-me">
                Date: <input type="date"><br>
                File: <input type="file">
            </form>

        <hr>

        <!--input type: Color-->
        <form action="/contact-me">
            Date: <input type="date"><br>
            File: <input type="file"><br>
            Color: <input type="color">
        </form>

        <hr>

        <!--input type:Range-->

        <form action="/contact-me">
            Date: <input type="date"><br>
            File: <input type="file"><br>
            Color: <input type color="color"><br>
            Price Range: <input type="range">
        </form>

        <!--input type button-->

           Button: <input type="button" value="click me"><br>

           Poke Me: <input type="button" value="poked"><br>

           <!--Submit is a special type of button-->

           Submit: <input type="submit"><br>

           <hr>

           <!--Input type:Radio-->

           <form>
            <label for="male">Male:</label>
            <input type="radio" id="male" name="gender" value="male"><br>
            <label for="female">Female:</label>
            <input type="radio" id="female" name="gender" value="female"><br>
            <label for="other">Other:</label>
            <input type="radio" id="other" name="gender" value="other">
            
           </form>

           <hr>

           <!--input type=Checkbok-->

           <form>

            <label for="apple">Apple:</label>
            <input type="checkbox" id="apple" name="fruit" value="apple"><br>
            <label for="mango">Mango:</label>
            <input type="checkbox" id="mango" name="fruit" value="mango">

           </form>

           <hr>

           <!--Input type=Select-->

           <form>
            <label for="country"> Select Your Country</label>
            <select name="country" id="country">
                <option value="india">India</option>
                <option value="US">US</option>
                <option value="UK">UK</option>
                <option value="Japan">Japan</option>
                <option value="Other">Other</option>
            </select>
           </form>

           <hr>

           <!--Input type=Textarea-->

           <textarea rows="4" cols="400">
            Please write a story

           </textarea>












</body>
</html>
